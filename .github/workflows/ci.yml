name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall gsc_server.py horizon_server.py gsc_safe tests
      - name: Run tests
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          exit $status
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-output.txt
      - name: Inspect Horizon server
        run: python -c "from horizon_server import mcp; print(mcp)"
